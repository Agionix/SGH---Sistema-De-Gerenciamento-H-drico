<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGH — Autenticação</title>
  <link rel="stylesheet" href="./css/login.css">
  <script>
    (function() {
      try {
        var s = localStorage.getItem('sgh_theme');
        var d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (s === 'dark' || (!s && d)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Barra Superior com Alternador de Modo Escuro -->
      <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem;">
        <button type="button" id="btnToggleTheme" class="btn-icon" title="Alternar modo escuro" aria-label="Alternar modo escuro">
          <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <div class="login-header">
        <h1 class="login-title" id="authTitle">Login</h1>
        <p class="login-subtitle" id="authSubtitle">Sistema de Gerenciamento Hidráulico</p>
      </div>

      <div id="alertBox" class="alert-box" role="alert"></div>

      <form id="authForm" novalidate>
        <!-- Campo: Usuário -->
        <div class="form-group">
          <label class="form-label" for="username" id="usernameLabel">Nome de Usuário</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="Ex: admin" 
              required 
              autocomplete="username"
              autofocus
            >
          </div>
        </div>

        <!-- Método de Recuperação: Código Dinâmico de 6 Dígitos ou PIN 1234 -->
        <div class="form-group" id="recoveryGroup" style="display: none;">
          <label class="form-label">Código de Verificação de Segurança</label>
          
          <div class="recovery-code-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;">Código do Servidor:</span>
              <button type="button" id="btnRefreshRecoveryCode" class="auth-switch-link" style="font-size: 0.75rem;">
                Gerar Novo
              </button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;">
              <div class="recovery-code-number" id="displayRecoveryCode">------</div>
              <button type="button" id="btnUseRecoveryCode" class="btn-secondary" style="font-size: 0.75rem; padding: 0.35rem 0.65rem;">
                Usar Código
              </button>
            </div>
          </div>

          <div class="input-wrapper">
            <input 
              type="text" 
              id="recoveryCodeInput" 
              name="recoveryCodeInput" 
              class="form-input" 
              placeholder="Digite o código acima ou PIN 1234" 
              autocomplete="off"
            >
          </div>
          <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.35rem;">
            Dica: você pode usar o código dinâmico gerado acima ou o PIN padrão <strong>1234</strong>.
          </div>
        </div>

        <!-- Campo: Senha -->
        <div class="form-group" id="passwordGroup">
          <label class="form-label" for="password" id="passwordLabel">Senha de Acesso</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Mostrar ou ocultar senha">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <!-- Linha "Lembrar Usuário" e "Esqueceu a Senha" no modo Login -->
          <div class="remember-row" id="loginOptionsRow">
            <label style="display: flex; align-items: center; gap: 0.45rem; cursor: pointer; user-select: none;">
              <input type="checkbox" id="chkRememberMe" checked>
              <span>Lembrar usuário</span>
            </label>
            <button type="button" id="btnForgotPass" class="auth-switch-link" style="font-size: 0.8rem; font-weight: 500;">
              Esqueceu a senha?
            </button>
          </div>
        </div>

        <!-- Campo: Confirmação de Senha (ativo nos modos Criar Conta e Recuperar Conta) -->
        <div class="form-group" id="confirmPasswordGroup" style="display: none;">
          <label class="form-label" for="confirmPassword" id="confirmPasswordLabel">Confirmar Senha</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword" 
              class="form-input" 
              placeholder="Repita sua senha" 
              autocomplete="new-password"
            >
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; margin-top: 0.75rem;">
          <span id="btnText">Entrar</span>
          <svg id="btnSpinner" style="display:none; animation: spin 1s linear infinite;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
          </svg>
        </button>
      </form>

      <!-- Alternador de Modo (Login, Criar Conta, Recuperar) -->
      <div class="auth-switch-prompt">
        <span id="switchPromptText">Não tem uma conta?</span>
        <button type="button" id="btnSwitchMode" class="auth-switch-link">Criar conta</button>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>

  <script type="module" src="./js/theme.js"></script>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
